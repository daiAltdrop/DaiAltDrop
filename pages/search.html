<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEROS — Пошук анкет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161e;
            --accent-pink: #e83e8c;
            --accent-gradient: linear-gradient(135deg, #ff2a7a 0%, #a01550 100%);
            --text-main: #ffffff;
            --text-muted: #b0b3c1;
            --border-glow: rgba(232, 62, 140, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Хедер у стилі LEROS */
        .profiles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
        }

        .brand-icon {
            color: var(--accent-pink);
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px rgba(232, 62, 140, 0.6));
        }

        .top-nav {
            display: flex;
            gap: 20px;
        }

        .top-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .top-nav a:hover, .top-nav a.active {
            color: var(--accent-pink);
        }

        .top-tools {
            display: flex;
            gap: 14px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--accent-pink);
            box-shadow: 0 0 10px var(--accent-pink);
        }

        /* Головна арена свайпу */
        .feed-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Контейнер під картки (пропорції як телефон) */
        .cards-viewport {
            position: relative;
            width: 100%;
            max-width: 410px;
            height: 82vh;
            max-height: 740px;
            perspective: 1200px;
        }

        /* Сама картка анкети */
        .feed-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            overflow: hidden;
            background-color: var(--card-bg);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(232, 62, 140, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            cursor: grab;
            touch-action: none;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.45s ease;
            will-change: transform, opacity;
        }

        .feed-card:active {
            cursor: grabbing;
        }

        .feed-card.dragging {
            transition: none; /* миттєвий відгук за мишкою */
        }

        /* Фото/фон картки */
        .card-media {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .card-media::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.2) 50%, rgba(11,12,16,0.95) 100%);
        }

        /* Контент анкети поверх зображення */
        .card-content {
            position: relative;
            z-index: 2;
            margin-top: auto;
            padding: 24px 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .badge-verified {
            background: rgba(232, 62, 140, 0.25);
            border: 1px solid var(--accent-pink);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            align-self: flex-start;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 1.85rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .age {
            font-weight: 400;
            opacity: 0.85;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.82rem;
            color: #f1f1f1;
        }

        .card-bio {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #d1d4dc;
        }

        /* Нижні кнопки дій як у додатках */
        .card-actions {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
        }

        .action-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .action-circle:hover {
            transform: scale(1.1);
        }

        .action-circle.like {
            background: var(--accent-gradient);
            border: none;
            box-shadow: 0 4px 15px rgba(232, 62, 140, 0.4);
        }

        .action-circle.dislike {
            color: #ff4757;
        }

        /* Підказка навігації праворуч */
        .controls-hint {
            position: absolute;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: var(--text-muted);
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 16px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        @media (max-width: 820px) {
            .controls-hint { display: none; }
            .cards-viewport {
                max-width: 92%;
                height: 84vh;
            }
        }
    </style>
</head>
<body>
    <header class="profiles-header">
        <a href="altu-case.html" class="brand-box" aria-label="На головну">
            <span class="brand-icon"><i class="fa-solid fa-heart"></i></span>
            <span class="brand-text">LEROS</span>
        </a>

        <nav class="top-nav" aria-label="Навігація">
            <a href="altu-case.html">Кейси</a>
            <a href="search.html" class="active">Пошук анкет</a>
        </nav>

        <div class="top-tools">
            <button class="tool-btn" aria-label="Профіль"><i class="fa-solid fa-user"></i></button>
        </div>
    </header>

    <main class="feed-container">
        <div class="cards-viewport" id="cardsViewport">
            <!-- Картки генеруються скриптом -->
        </div>

        <div class="controls-hint">
            <i class="fa-solid fa-arrow-up"></i>
            <span>Свайп вгору: <span class="key-badge">W</span> або <span class="key-badge">↑</span></span>
            <i class="fa-solid fa-arrow-down"></i>
            <span>Свайп вниз: <span class="key-badge">S</span> або <span class="key-badge">↓</span></span>
            <span style="font-size: 0.75rem; opacity: 0.7;">або тягни мишкою</span>
        </div>
    </main>

    <script>
        // База анкет
        const profiles = [
            {
                name: "Аліса",
                age: 19,
                bio: "Слухаю Crystal Castles, гуляю вночі, обожнюю оверсайз худі та плівкові фото.",
                tags: ["Goth / Alt", "1.72 м", "Київ"],
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Мілана",
                age: 21,
                bio: "Кіберпанк естетика, рейви, кава без цукру і нескінченний плейлист фонку.",
                tags: ["E-Girl", "Cyberpunk", "Львів"],
                image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Єва",
                age: 20,
                bio: "Шукаю того, з ким можна дивитися аніме до ранку та малювати скетчі.",
                tags: ["Anime", "Vintage", "Одеса"],
                image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=80"
            },
            {
                name: "Кіра",
                age: 22,
                bio: "Татуювання, чорна кава, пост-панк та повний ігнор токсичності.",
                tags: ["Post-punk", "Tattoo", "Харків"],
                image: "https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=700&q=80"
            }
        ];

        const viewport = document.getElementById('cardsViewport');
        let currentIndex = 0;
        let isAnimating = false;

        function createCardElement(data, index) {
            const card = document.createElement('article');
            card.className = 'feed-card';
            card.dataset.index = index;

            card.innerHTML = `
                <div class="card-media" style="background-image: url('${data.image}')"></div>
                <div class="card-content">
                    <span class="badge-verified"><i class="fa-solid fa-check"></i> Перевірена анкета</span>
                    <h2 class="card-title">${data.name} <span class="age">${data.age}</span></h2>
                    <div class="card-tags">
                        ${data.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <p class="card-bio">${data.bio}</p>
                    <div class="card-actions">
                        <button class="action-circle dislike" onclick="swipe('next')" aria-label="Скіп"><i class="fa-solid fa-xmark"></i></button>
                        <button class="action-circle like" onclick="swipe('next')" aria-label="Лайк"><i class="fa-solid fa-heart"></i></button>
                    </div>
                </div>
            `;
            return card;
        }

        // Рендеримо картки у стек (TikTok/Tinder stack)
        function renderStack() {
            viewport.innerHTML = '';
            for (let i = profiles.length - 1; i >= currentIndex; i--) {
                const card = createCardElement(profiles[i], i);
                const offset = i - currentIndex;

                // Ефект глибини стопки
                if (offset === 0) {
                    card.style.transform = `translateY(0px) scale(1)`;
                    card.style.opacity = '1';
                    card.style.zIndex = '10';
                    initDrag(card);
                } else if (offset === 1) {
                    card.style.transform = `translateY(22px) scale(0.94)`;
                    card.style.opacity = '0.7';
                    card.style.zIndex = '9';
                } else {
                    card.style.transform = `translateY(40px) scale(0.88)`;
                    card.style.opacity = '0.3';
                    card.style.zIndex = '8';
                }
                viewport.appendChild(card);
            }
        }

        // Логіка перемикання (TikTok-style Vertical Swipe)
        function swipe(direction = 'next') {
            if (isAnimating) return;
            const activeCard = viewport.querySelector(`.feed-card[data-index="${currentIndex}"]`);
            if (!activeCard) return;

            isAnimating = true;

            if (direction === 'next') {
                // Плавний відліт вгору з обертанням і розмиттям
                activeCard.style.transform = `translateY(-120vh) rotate(-8deg) scale(0.85)`;
                activeCard.style.opacity = '0';

                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex >= profiles.length) {
                        currentIndex = 0; // Зациклюємо коло анкет
                    }
                    renderStack();
                    isAnimating = false;
                }, 400);
            } else if (direction === 'prev' && currentIndex > 0) {
                currentIndex--;
                renderStack();
                isAnimating = false;
            } else {
                isAnimating = false;
            }
        }

        // Перетягування мишкою (Drag & Touch)
        function initDrag(card) {
            let startY = 0;
            let currentY = 0;
            let isDragging = false;

            const onStart = (e) => {
                if (isAnimating) return;
                isDragging = true;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                card.classList.add('dragging');
            };

            const onMove = (e) => {
                if (!isDragging) return;
                currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                const deltaY = currentY - startY;

                // Додаємо невеликий нахил картки при перетягуванні
                const rotate = (deltaY / 25).toFixed(2);
                card.style.transform = `translateY(${deltaY}px) rotate(${rotate}deg)`;
            };

            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                card.classList.remove('dragging');
                const deltaY = currentY - startY;

                // Якщо свайпнули вгору більше ніж на 90px — перемикаємо
                if (deltaY < -90) {
                    swipe('next');
                } else {
                    // Повертаємо на місце з пружною анімацією
                    card.style.transform = 'translateY(0px) rotate(0deg) scale(1)';
                }
            };

            card.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            card.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        // Керування клавіатурою: W, S, стрілки вгору/вниз
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') {
                e.preventDefault();
                swipe('next');
            } else if (key === 's' || key === 'arrowdown') {
                e.preventDefault();
                swipe('prev');
            }
        });

        // Колесо миші
        let wheelTimeout;
        window.addEventListener('wheel', (e) => {
            if (wheelTimeout) return;
            if (e.deltaY > 30) {
                swipe('next');
            } else if (e.deltaY < -30) {
                swipe('prev');
            }
            wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 500);
        });

        // Перший запуск
        renderStack();
    </script>
</body>
</html>
