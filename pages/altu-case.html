<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEROS — Кейси альтух</title>
    <link rel="stylesheet" href="altu-case.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="profiles-body">
    <div class="profiles-shell">
        <header class="profiles-header">
            <a href="index.html" class="brand-box" aria-label="На головну">
                <span class="brand-icon"><i class="fa-solid fa-heart"></i></span>
                <span class="brand-text">LEROS</span>
            </a>

            <nav class="top-nav" aria-label="Навігація">
                <a href="index.html">Головна</a>
                <a href="index.html">Продукти</a>
                <a href="index.html">Команда</a>
                <a href="index.html">Блог</a>
                <a href="index.html">Контакти</a>
                <a href="index.html">Преміум</a>
            </nav>

            <div class="top-tools" aria-label="Інструменти">
                <button class="tool-btn" aria-label="Пошук"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="tool-btn" aria-label="Кошик"><i class="fa-solid fa-bag-shopping"></i></button>
                <button class="tool-btn" aria-label="Профіль"><i class="fa-solid fa-user"></i></button>
            </div>
        </header>

        <main class="profiles-main">
            <h1 class="profiles-title">КЕЙСИ АЛЬТУХ</h1>

            <section class="profiles-grid" aria-label="Анкети альтух">
                <article class="profile-card">
                    <div class="profile-art art-steel"></div>
                    <div class="profile-info">
                        <h2>КЕЙС №1:<br>БЮДЖЕТНИЙ</h2>
                        <p class="profile-price">Ціна: 100 гривень</p>
                        <button type="button">Відкрити</button>
                    </div>
                </article>

                <article class="profile-card">
                    <div class="profile-art art-cyber"></div>
                    <div class="profile-info">
                        <h2>КЕЙС №2:<br>КІБЕР-ПРЕМІУМ</h2>
                        <p class="profile-price">Ціна: 250 гривень</p>
                        <button type="button">Відкрити</button>
                    </div>
                </article>

                <article class="profile-card">
                    <div class="profile-art art-ornament"></div>
                    <div class="profile-info">
                        <h2>КЕЙС №3:<br>МІСТИЧНА<br>ПОЕЗІЯ</h2>
                        <p class="profile-price">Ціна: 500 гривень</p>
                        <button type="button">Відкрити</button>
                    </div>
                </article>

                <article class="profile-card">
                    <div class="profile-art art-wood"></div>
                    <div class="profile-info">
                        <h2>КЕЙС №4:<br>ПОБУТОВЕ<br>ЩАСТЯ</h2>
                        <p class="profile-price">Ціна: 1000 гривень</p>
                        <button type="button">Відкрити</button>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
