<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEROS — Кейси альтух</title>
    <link rel="stylesheet" href="altu-case.css">
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="profiles-body">
    <div class="profiles-shell">
        <header class="profiles-header">
            <a href="index.html" class="brand-box" aria-label="На головну">
                <span class="brand-icon"><i class="fa-solid fa-heart"></i></span>
                <span class="brand-text">LEROS</span>
            </a>

            <nav class="top-nav" aria-label="Навігація">
                <a href="index.html">Головна</a>
                <a href="index.html">Продукти</a>
                <a href="index.html">Команда</a>
                <a href="index.html">Блог</a>
                <a href="index.html">Контакти</a>
                <a href="index.html">Преміум</a>
            </nav>

            <div class="top-tools" aria-label="Інструменти">
                <button class="tool-btn" aria-label="Пошук"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="tool-btn" aria-label="Кошик"><i class="fa-solid fa-bag-shopping"></i></button>
                <button class="tool-btn" aria-label="Профіль"><i class="fa-solid fa-user"></i></button>
            </div>
        </header>

        <main class="profiles-main">
            <h1 class="profiles-title">КЕЙСИ АЛЬТУХ</h1>

            <section class="profiles-grid" aria-label="Анкети альтух">
                <article class="profile-card">
                    <div class="profile-art art-steel" style="height: 280px; overflow: hidden;">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR15mjfKqea8aYR1EbZh07I3tVNZXJ_T0JkZj2JaenVPdOkF2-vk3kdNtY&s=10" alt="Кейс Бюджетний" class="case-img" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block;">
                    </div>
                    <div class="profile-info">
                        <h2>КЕЙС №1:<br>БЮДЖЕТНИЙ</h2>
                        <p class="profile-price">Ціна: 100 гривень</p>
                        <button class="button button--primary" type="button">Відкрити</button>
                    </div>
                </article>

                <article class="profile-card">
                    <div class="profile-art art-cyber" style="height: 280px; overflow: hidden;">
                        <img src="https://i.pinimg.com/736x/62/71/41/627141c41d3347d11a7f1166d94ca116.jpg" alt="Кейс Кібер-преміум" class="case-img" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block;">
                    </div>
                    <div class="profile-info">
                        <h2>КЕЙС №2:<br>КІБЕР-ПРЕМІУМ</h2>
                        <p class="profile-price">Ціна: 250 гривень</p>
                        <button class="button button--primary" type="button">Відкрити</button>
                    </div>
                </article>

                <article class="profile-card">
                    <div class="profile-art art-ornament" style="height: 280px; overflow: hidden;">
                        <img src="https://i.pinimg.com/474x/29/ee/f1/29eef18b593a188bc0881f20b672e88b.jpg" alt="Кейс Містична поезія" class="case-img" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block;">
                    </div>
                    <div class="profile-info">
                        <h2>КЕЙС №3:<br>МІСТИЧНА<br>ПОЕЗІЯ</h2>
                        <p class="profile-price">Ціна: 500 гривень</p>
                        <button class="button button--primary" type="button">Відкрити</button>
                    </div>
                </article>

                <article class="profile-card">
                    <div class="profile-art art-wood" style="height: 280px; overflow: hidden;">
                        <img src="https://i.pinimg.com/236x/7f/a8/27/7fa8277c12d39ee9f1dc72746022db72.jpg" alt="Кейс Побутове щастя" class="case-img" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block;">
                    </div>
                    <div class="profile-info">
                        <h2>КЕЙС №4:<br>ПОБУТОВЕ<br>ЩАСТЯ</h2>
                        <p class="profile-price">Ціна: 1000 гривень</p>
                        <button class="button button--primary" type="button">Відкрити</button>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
